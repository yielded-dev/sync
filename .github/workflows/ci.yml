# Keep the required workflow on every PR; select expensive work inside it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Retargeting changes the diff without changing the head commit.
    # The jobs below ignore title and description edits.
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  # Complete main baselines; supersede older runs only on the same PR.
  # Metadata edits must not cancel a run that is validating the PR.
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base) && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: "true"
  VP_GIT_HOOKS: "0"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Select required checks
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      full: ${{ steps.paths.outputs.full }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - name: Classify the complete PR diff
        id: paths
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          retries: 2
          script: |
            const pr = context.payload.pull_request;
            // Main warms complete task results. Release metadata still needs
            // package builds and consumer validation.
            let full = !pr || (pr.base.ref === 'main' &&
              pr.head.ref === 'changeset-release/main' &&
              pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo);
            let docs = false;
            if (!full) {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo, pull_number: pr.number, per_page: 100,
                });
                const { data: current } = await github.rest.pulls.get({
                  ...context.repo, pull_number: pr.number,
                });
                // The API caps its file listing. Incomplete or moved diffs must
                // never authorize skips, including renames out of source paths.
                if (!files.length || files.length !== current.changed_files ||
                    current.head.sha !== pr.head.sha || current.base.sha !== pr.base.sha) {
                  full = true;
                } else {
                  const passive = /^(?:[^/]+\.md|LICENSE|docs\/TOOLCHAIN\.md|(?:packages|examples)\/[^/]+\/(?:README|CHANGELOG)\.md|\.changeset\/[^/]+\.md)$/;
                  for (const file of files) {
                    for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                      // Changes to the commands or setup that run CI exercise
                      // the full gate. Other workflows get actionlint below.
                      if (path === '.github/workflows/ci.yml' || path.startsWith('.github/actions/')) {
                        full = true;
                      } else if (/^packages\/[^/]+\/README\.md$/.test(path) &&
                          (file.status === 'removed' || path === file.previous_filename)) {
                        // release:check requires README.md in every library tarball.
                        full = true;
                      } else if (passive.test(path) || /^(?:\.agents|\.claude|\.opencode)\//.test(path) ||
                          /^\.github\/(?:workflows\/[^/]+\.ya?ml|assets\/.*|[^/]+\.md)$/.test(path)) {
                        continue;
                      } else if (path.startsWith('docs/')) {
                        docs = true;
                      } else {
                        // Unknown paths are executable inputs until classified.
                        full = true;
                      }
                    }
                  }
                }
              } catch (error) {
                core.warning(`Cannot prove a limited diff; running full CI: ${error.message}`);
                full = true;
              }
            }
            core.setOutput('full', String(full));
            core.setOutput('docs', String(docs && !full));
            await core.summary.addRaw(full ? 'Full checks, tests, and builds required.' :
              docs ? 'Formatting, workflow validation, and docs checks/build required.' :
              'Formatting and workflow validation required.').write();

  ready:
    # A skipped metadata edit must not replace the required check's real result.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata edit' || 'ready' }}
    needs: changes
    # A failed classifier must fail the required check, not silently skip it.
    if: ${{ always() && (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Require a complete path selection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          DOCS: ${{ needs.changes.outputs.docs }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$FULL:$DOCS" in
            true:false|false:true|false:false) ;;
            *) exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CI
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          task-cache: ci

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Check formatting for a limited diff
        id: format
        if: needs.changes.outputs.full != 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 2m
          command: vp run ci:format

      - name: Check and build docs
        id: docs
        if: needs.changes.outputs.docs == 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 4m
          command: vp run -v ci:docs

      # Workspace imports resolve to dist; preserve the local ready gate's order.
      - name: Build packages, examples, and docs
        id: build
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 4m
          command: vp run -v build

      - name: Format, lint, and type checks
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 3m
          command: vp run -v check

      - name: Install Chromium for persistence tests
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/run-ci
        with:
          # A warm image finishes in seconds. A cold --with-deps install fetches
          # fonts through apt and then the browser; 2m dies mid-download, and
          # the retry then loses the still-held dpkg lock.
          timeout: 10m
          retry-errors: "true"
          command: vp -C packages/local-indexeddb exec playwright install --with-deps chromium

      - name: Run isolated test cases with timeout retries
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 3m
          command: >-
            vp run -v --concurrency-limit 2
            -F './packages/*' -F './examples/*'
            -F '!@yielded/sync-local-expo'
            -F '!@yielded/sync-local-indexeddb'
            -F '!@yielded/sync-platform-effect-cf'
            -F '!sync-list-board-example' test
            --retry.count 2 --retry.delay 1000
            --retry.condition 'timed out|timeout|ETIMEDOUT|ESOCKETTIMEDOUT'

      - name: Run stateful suites with a fresh-process retry
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 4m
          # beforeAll owns browser/SQLite/DO state. An in-process case retry
          # would reuse a failed case's data. Restart once; keep failures fatal.
          retry-errors: "true"
          command: >-
            vp run -v --parallel --concurrency-limit 1 --fail-if-no-match
            -F '@yielded/sync-local-expo'
            -F '@yielded/sync-local-indexeddb'
            -F '@yielded/sync-platform-effect-cf'
            -F 'sync-list-board-example' test --retry.count 0

      - name: Validate packed consumers
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 4m
          command: vp run -v release:check

      # Vite never saves failed tasks. Keep successful work after later failures.
      - name: Save Vite Task cache
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure' || steps.docs.outcome == 'success' || steps.docs.outcome == 'failure' || steps.format.outcome == 'success') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.setup.outputs.cache-key }}
