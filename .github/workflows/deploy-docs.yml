name: Deploy docs

on:
  workflow_run:
    workflows: [Publish beta]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  publication:
    name: Check publication
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run') && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/publish-beta.yml' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      published: ${{ steps.publication.outputs.published }}
    steps:
      - name: Require a successful publisher or manual deployment
        id: publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('published', 'true');
              return;
            }
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo,
              run_id: run.id,
              attempt_number: run.run_attempt,
            });
            core.setOutput('published', jobs.some(job =>
              job.name === 'Publish beta packages' && job.conclusion === 'success'));

  deploy:
    name: Deploy docs
    needs: publication
    if: ${{ needs.publication.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check current main
        id: current
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          echo "matches=$([ "$latest" = "$SOURCE_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: ${{ steps.current.outputs.matches == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up Bun
        if: ${{ steps.current.outputs.matches == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        if: ${{ steps.current.outputs.matches == 'true' }}
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Deploy validated docs
        if: ${{ steps.current.outputs.matches == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          ./node_modules/.bin/vp run docs:deploy
