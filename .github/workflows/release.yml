name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  version:
    name: Update release pull request
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: release-push
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      # App-authored updates trigger PR CI, unlike GITHUB_TOKEN pushes.
      - name: Mint the release token
        if: ${{ steps.select-mode.outputs.mode == 'version' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check current main
        id: current
        run: |
          set -euo pipefail
          LATEST_MAIN="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          echo "current=$([ "$LATEST_MAIN" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create release pull request
        if: ${{ steps.current.outputs.current == 'true' && steps.select-mode.outputs.mode == 'version' }}
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          script: ./node_modules/.bin/vp run --no-cache ci:version
