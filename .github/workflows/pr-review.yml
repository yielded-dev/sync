name: PR Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number for a full review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        startsWith(github.event.comment.body, '@effect-agent review')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted repository guidance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This job has secrets and write permissions. Never execute PR-head code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Review the pull request
        uses: danieljvdm/effect-agent/action@action-v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
          check-name: Effect Agent review
          checks-token: ${{ github.token }}
          mode: ${{ github.event_name == 'pull_request_target' && 'auto' || github.event_name == 'workflow_dispatch' && 'full' || 'incremental' }}
          command: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          comment-id: ${{ github.event.comment.id || 0 }}
          expected-head: ${{ github.event.pull_request.head.sha || '' }}
          automatic-review-limit: 2
          guidance-file: AGENTS.md
          model: gpt-6-astra
          effort: medium
          priority: default
          base-cost-usd: "1.00"
          max-cost-usd: "2.50"
          ignore: "bun.lock,**/CHANGELOG.md,.agents/skills/**,.claude/skills/**"
